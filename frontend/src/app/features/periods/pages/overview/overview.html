<div style="flex:1; display:flex; flex-direction:column; min-height:0;">
  <div class="grid-2x2-top">
    <div>
      <div class="stat-label">INICIO DEL PERÍODO</div>
      <div class="stat-value cyan periodos">{{ periodStart }}</div>
    </div>
    <div>
      <div class="stat-label">FINALIZACIÓN DEL PERÍODO</div>
      <div class="stat-value cyan periodos">{{ periodEnd }}</div>
    </div>
    <div>
      <div class="stat-label">FECHA ACTUAL</div>
      <div class="stat-value cyan periodos">{{ currentDate }}</div>
    </div>
    <div>
      <div class="stat-label">DÍAS RESTANTES</div>
      <div class="stat-value cyan periodos">{{ daysRemaining }} días</div>
    </div>
  </div>
  <div class="chart-area">
    <div class="chart-heading">ESTADÍSTICAS GENERALES</div>
    <div class="chart-legend">
      <span><span class="legend-dot" style="background:var(--blue-bar)"></span>Gastos actuales</span>
      <span><span class="legend-dot" style="background:var(--purple)"></span>Ingresos actuales</span>
    </div>
    <div class="chart-body">
      <div class="chart-yaxis">
        <span>25.000</span><span>20.000</span><span>15.000</span><span>10.000</span><span>5.000</span><span>0</span>
      </div>
      <div class="chart-bars">
        <div class="chart-gridlines">
          <div></div><div></div><div></div><div></div><div></div><div></div>
        </div>
        <div class="chart-bar" [style.height.%]="gastosHeight" style="background:linear-gradient(180deg,#8fb8ff,var(--blue-bar));"></div>
        <div class="chart-bar" [style.height.%]="ingresosHeight" style="background:linear-gradient(180deg,#dcccff,var(--purple));"></div>
      </div>
    </div>
    <div class="chart-xaxis">{{ periodStart }} - {{ periodEnd }}</div>
  </div>
</div>
