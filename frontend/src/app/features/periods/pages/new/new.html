<div class="view-form">
  <div class="section-title">NUEVO PERÍODO</div>
  <div class="form-grid">
    <div class="form-field">
      <label>AÑO</label>
      <input type="number" class="glow-pill" [(ngModel)]="year">
    </div>
    <div class="form-field">
      <label>MES</label>
      <select class="glow-pill" [(ngModel)]="month">
        <option [value]="1">Enero</option>
        <option [value]="2">Febrero</option>
        <option [value]="3">Marzo</option>
        <option [value]="4">Abril</option>
        <option [value]="5">Mayo</option>
        <option [value]="6">Junio</option>
        <option [value]="7">Julio</option>
        <option [value]="8">Agosto</option>
        <option [value]="9">Septiembre</option>
        <option [value]="10">Octubre</option>
        <option [value]="11">Noviembre</option>
        <option [value]="12">Diciembre</option>
      </select>
    </div>
  </div>
  <div class="form-highlight">
    <button class="btn-primary" style="max-width:260px;" (click)="createPeriod()" [disabled]="saving">Crear Período</button>
    <div class="save-msg">{{ saveMessage }}</div>
  </div>
</div>
