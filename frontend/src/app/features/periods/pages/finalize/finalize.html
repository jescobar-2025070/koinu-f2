<div class="view-form">
  <div class="section-title">FINALIZAR PERÍODO ACTUAL</div>
  @if (currentPeriod) {
    <div class="form-grid">
      <div class="form-field">
        <label>AÑO</label>
        <input type="number" class="glow-pill" [value]="year" readonly>
      </div>
      <div class="form-field">
        <label>MES</label>
        <input type="text" class="glow-pill" [value]="monthName" readonly>
      </div>
      <div class="form-field">
        <label>INGRESOS TOTALES</label>
        <input type="text" class="glow-pill" [value]="formatCurrency(totalIngresos)" readonly>
      </div>
      <div class="form-field">
        <label>GASTOS TOTALES</label>
        <input type="text" class="glow-pill" [value]="formatCurrency(totalGastos)" readonly>
      </div>
    </div>
    <div class="form-highlight">
      <button class="btn-primary" style="max-width:260px;" (click)="finalizePeriod()" [disabled]="finalizing">Finalizar Período</button>
      <div class="save-msg">{{ saveMessage }}</div>
    </div>
  } @else {
    <div style="text-align:center; color:rgba(255,255,255,0.5); padding:40px;">No hay período abierto para finalizar</div>
  }
</div>
