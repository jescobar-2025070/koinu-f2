<div class="view-table">
  <div class="section-title">HISTORIAL DE PERÍODOS</div>
  <div class="table-wrap scroll-y">
    <table>
      <thead>
        <tr>
          <th><span class="th-pill">AÑO</span></th>
          <th><span class="th-pill">MES</span></th>
          <th><span class="th-pill">ESTADO</span></th>
          <th><span class="th-pill">INGRESOS</span></th>
          <th><span class="th-pill">GASTOS</span></th>
        </tr>
      </thead>
      <tbody>
        @for (period of periods; track period.id) {
          <tr>
            <td>{{ period.year }}</td>
            <td>{{ getMonthName(period.month) }}</td>
            <td>{{ period.status }}</td>
            <td class="right" style="color:var(--green)">{{ formatCurrency(period.totalIngresos) }}</td>
            <td class="right" style="color:#ff8080">{{ formatCurrency(period.totalGastos) }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" style="text-align:center; color:rgba(255,255,255,0.5);">No hay períodos en el historial</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
