<div id="login-view">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>NUEVA CONTRASEÑA</h1>

    @if (errorMessage) {
      <div class="alert alert--error">
        <span class="material-symbols-outlined alert__icon">error</span>
        <span>{{ errorMessage }}</span>
      </div>
    }

    @if (successMessage) {
      <div class="alert alert--success">
        <span class="material-symbols-outlined alert__icon">check_circle</span>
        <span>{{ successMessage }}</span>
      </div>
    }

    <div class="field">
      <label for="token">Token de recuperación</label>
      <input class="pill-input" id="token" type="text" formControlName="token" autocomplete="off" placeholder="Código recibido">
    </div>

    <div class="field">
      <label for="password">Nueva Contraseña</label>
      <input class="pill-input" id="password" type="password" formControlName="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
    </div>

    <div class="field">
      <label for="confirmPassword">Confirmar Contraseña</label>
      <input class="pill-input" id="confirmPassword" type="password" formControlName="confirmPassword" autocomplete="new-password" placeholder="Repita la contraseña">
    </div>

    <div class="signup-row">
      <a class="link" routerLink="/login">Volver al inicio de sesión</a>
    </div>

    <button type="submit" class="btn-primary" [disabled]="submitting">
      {{ submitting ? 'Guardando…' : 'Guardar Contraseña' }}
    </button>
  </form>

  <div class="footer-row">
    <div class="copyright">© 2026 Koinu Finance. Todos los derechos reservados.</div>
    <div class="legal-pill">
      <span>Privacidad</span>
      <span>Términos</span>
      <span>Ayuda</span>
      <span>Contacto</span>
    </div>
  </div>
</div>
