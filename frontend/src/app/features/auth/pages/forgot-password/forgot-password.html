<div id="login-view">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>RECUPERAR CONTRASEÑA</h1>

    @if (errorMessage) {
      <div class="alert alert--error">
        <span class="material-symbols-outlined alert__icon">error</span>
        <span>{{ errorMessage }}</span>
      </div>
    }

    @if (infoMessage) {
      <div class="alert alert--success">
        <span class="material-symbols-outlined alert__icon">check_circle</span>
        <span>{{ infoMessage }}</span>
      </div>
    }

    @if (devToken) {
      <div class="dev-token">
        <label>TOKEN DE DESARROLLO (copia este código)</label>
        <input class="pill-input" [value]="devToken" readonly>
      </div>
    }

    <div class="field">
      <label for="email">Correo Electrónico</label>
      <input class="pill-input" id="email" type="email" formControlName="email" autocomplete="email" placeholder="tu@correo.com">
    </div>

    <div class="signup-row">
      ¿Recordó su contraseña? <br>
      <a class="link" routerLink="/login">Iniciar sesión</a>
    </div>

    <button type="submit" class="btn-primary" [disabled]="submitting">
      {{ submitting ? 'Enviando…' : 'Enviar Enlace' }}
    </button>
  </form>

  <div class="footer-row">
    <div class="copyright">© 2026 Koinu Finance. Todos los derechos reservados.</div>
    <div class="legal-pill">
      <span>Privacidad</span>
      <span>Términos</span>
      <span>Ayuda</span>
      <span>Contacto</span>
    </div>
  </div>
</div>
